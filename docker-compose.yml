services:
  db:
    image: postgres:17
    container_name: club-db
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
      POSTGRES_DB: club_reservas
    ports:
      - "5434:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club_reservas"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
