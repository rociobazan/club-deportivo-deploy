name: CI

on:
  # Todo PR, apunte a la rama que apunte: los PRs apilados sobre otra rama
  # también tienen que pasar el CI. La protección de main exige los checks solo ahí.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Los ids `specs`, `api`, `web` y `e2e` son los checks obligatorios de la protección
  # de main: si se renombran, hay que actualizar la regla.
  specs:
    name: specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Validar OpenSpec
        run: npm run spec:validate
      - name: Validar el contrato OpenAPI
        run: npm run contrato:lint

  api:
    name: api
    runs-on: ubuntu-latest
    needs: specs
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: club
          POSTGRES_PASSWORD: club
          POSTGRES_DB: club_reservas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://club:club@localhost:5432/club_reservas_test
      JWT_EXPIRES_IN: 1h
    steps:
      - uses: actions/checkout@v7
      # El secreto con el que se firman las sesiones no se escribe acá. El CI
      # solo necesita *uno válido* para que la app arranque, así que se genera
      # al azar en cada corrida: un valor literal en un repo público invita a
      # copiarlo a producción, y ahí cualquiera podría firmarse un token de
      # ADMIN. Los e2e de la API ni lo usan: fijan el suyo en base.e2e-spec.ts.
      - name: Generar el JWT_SECRET de esta corrida
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # npm 11 no corre el postinstall de @prisma/client sin aprobación: se genera explícito.
      - name: Generar el cliente de Prisma
        run: npm exec --workspace api -- prisma generate
      - name: Aplicar las migraciones en una base vacía
        run: npm exec --workspace api -- prisma migrate deploy
      - name: Lint
        run: npm run lint --workspace api
      - name: Build
        run: npm run build --workspace api
      - name: Tests unitarios
        run: npm run test --workspace api
      - name: Tests e2e
        run: npm run test:e2e --workspace api

  web:
    name: web
    runs-on: ubuntu-latest
    needs: specs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint --workspace web
      # El build corre TypeScript, así que también verifica los tipos que el
      # front genera desde el contrato.
      - name: Build
        run: npm run build --workspace web

  # Tests de navegador sobre el sitio construido (ADR 0002). Necesita la pila
  # entera: el front llama a la API del lado del servidor, así que sin API de
  # Nest y sin base estos tests no probarían nada.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    needs: [api, web]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: club
          POSTGRES_PASSWORD: club
          POSTGRES_DB: club_reservas_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://club:club@localhost:5432/club_reservas_e2e
      JWT_EXPIRES_IN: 1h
      # El front habla con la API por acá, desde su proceso de servidor.
      API_URL: http://localhost:3000/api/v1
    steps:
      - uses: actions/checkout@v7
      # Igual que en el job `api`: se genera al azar y no se escribe en el repo.
      # Acá sí se usa de verdad, porque este job levanta la API con `start:prod`.
      - name: Generar el JWT_SECRET de esta corrida
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Generar el cliente de Prisma
        run: npm exec --workspace api -- prisma generate
      - name: Aplicar las migraciones en una base vacía
        run: npm exec --workspace api -- prisma migrate deploy
      # A diferencia del job `api`, acá el seed sí corre: sin catálogo, la
      # pantalla de disponibilidad no tendría canchas que mostrar y el test
      # pasaría sin comprobar que el front consume la API.
      - name: Cargar el catálogo de prueba
        run: npm exec --workspace api -- prisma db seed

      - name: Build de la API
        run: npm run build --workspace api
      # `nohup` y redirección: sin eso el proceso queda atado al shell del paso
      # y el log se pierde, que es justo lo que hace falta si no arranca.
      - name: Levantar la API
        run: nohup npm run start:prod --workspace api > api.log 2>&1 &
      - name: Esperar a que la API responda
        run: |
          for intento in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1 > /dev/null; then
              echo "API arriba en el intento $intento"
              exit 0
            fi
            sleep 2
          done
          echo "La API no respondió en 60 segundos. Su log:"
          cat api.log
          exit 1

      # El front lo levanta Playwright con `next start` (playwright.config.ts),
      # pero el build tiene que existir antes.
      - name: Build del front
        run: npm run build --workspace web
      - name: Instalar Chromium
        run: npm exec --workspace web -- playwright install chromium --with-deps
      - name: Tests e2e de navegador
        run: npm run e2e --workspace web

      - name: Guardar el reporte si algo falló
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
            api.log
          retention-days: 7

  # Despliegue en la instancia EC2 (ADR 0003). Solo después de un merge a main
  # con todo en verde; en los PRs no corre, así que no es un check obligatorio.
  deploy:
    name: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [e2e]
    runs-on: ubuntu-latest
    # Dos merges seguidos no pueden desplegar a la vez: el segundo espera.
    concurrency:
      group: deploy-produccion
      cancel-in-progress: false
    environment:
      name: produccion
      url: https://clubdeploy.online
    permissions:
      contents: read
      packages: write
    # Los secretos entran como variables y no con ${{ }} dentro de los scripts:
    # así nunca forman parte del texto del comando.
    env:
      IMAGE_TAG: ${{ github.sha }}
      EC2_HOST: ${{ secrets.EC2_HOST }}
      EC2_USER: ${{ secrets.EC2_USER }}
    steps:
      - uses: actions/checkout@v7
      # GHCR exige el dueño en minúsculas.
      - name: Nombre de las imágenes
        run: echo "GHCR_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      # Las imágenes se construyen acá y no en la instancia: el build de Next no
      # entra en la memoria de una t3.micro. Las actions de terceros van fijadas
      # por SHA y no por tag: este job maneja la clave SSH de producción y puede
      # publicar en GHCR, y un tag se puede volver a apuntar a otro código.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Imagen de la API
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.GHCR_OWNER }}/club-deploy-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Imagen del front
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ env.GHCR_OWNER }}/club-deploy-web:${{ env.IMAGE_TAG }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # La huella del servidor va en un secreto y no se pide con ssh-keyscan: así
      # una máquina que se hiciera pasar por la instancia no recibe el deploy.
      - name: Configurar SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$EC2_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Copiar la configuración de la pila
        run: >-
          scp -i ~/.ssh/id_deploy
          deploy/docker-compose.prod.yml deploy/Caddyfile
          "$EC2_USER@$EC2_HOST:/opt/club/"
      # Migraciones antes de levantar la API nueva: si fallan, `set -e` corta acá
      # y la versión anterior sigue corriendo.
      - name: Desplegar
        run: |
          ssh -i ~/.ssh/id_deploy "$EC2_USER@$EC2_HOST" \
            IMAGE_TAG="$IMAGE_TAG" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/club
          # Asegura el salto de línea final antes de agregar: sin él, IMAGE_TAG
          # quedaría pegado a la última variable del archivo.
          sed -i -e '/^IMAGE_TAG=/d' -e '$a\' .env
          echo "IMAGE_TAG=$IMAGE_TAG" >> .env
          docker compose pull api web
          docker compose up -d --wait db
          docker compose run --rm api npm exec -- prisma migrate deploy
          docker compose up -d --wait --remove-orphans
          # -a: las imágenes de deploys anteriores tienen tag (su SHA), así que
          # no cuentan como colgadas. Sin esto, cada deploy suma unos 2 GB.
          docker image prune -af
          EOF
      - name: Comprobar que la API responde
        run: curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://clubdeploy.online/api/v1
