# Pila de producción en la instancia EC2 (ADR 0003). Vive en /opt/club junto
# con el Caddyfile y el .env; el job `deploy` del CI copia los dos primeros y
# fija IMAGE_TAG. El .env lo arma una persona y nunca sale de la instancia.
name: club-deploy

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD en .env}
      POSTGRES_DB: club_reservas
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club_reservas"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sin `ports`: solo la API llega a la base, por la red interna.

  api:
    image: ghcr.io/${GHCR_OWNER:?falta GHCR_OWNER en .env}/club-deploy-api:${IMAGE_TAG:?falta IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://club:${POSTGRES_PASSWORD}@db:5432/club_reservas
      FRONTEND_URL: https://${DOMINIO:?falta DOMINIO en .env}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/v1').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  web:
    image: ghcr.io/${GHCR_OWNER}/club-deploy-web:${IMAGE_TAG}
    restart: unless-stopped
    # Lista explícita y no `env_file`: el front no necesita los secretos de la API.
    # Los valores por defecto son los mismos que en apps/web/.env.example.
    environment:
      NODE_ENV: production
      API_URL: http://api:3000/api/v1
      HORA_APERTURA: ${HORA_APERTURA:-08:00}
      HORA_CIERRE: ${HORA_CIERRE:-23:00}
      HORA_CIERRE_SABADO: ${HORA_CIERRE_SABADO:-18:00}
      # Sin dos puntos: vacía significa "abre todos los días", igual que en la
      # API, y solo una variable ausente cae en el domingo cerrado.
      DIAS_CERRADOS: ${DIAS_CERRADOS-0}
      ZONA_HORARIA_CLUB: ${ZONA_HORARIA_CLUB:-America/Argentina/Cordoba}
      CANCELACION_MINUTOS_MINIMOS: ${CANCELACION_MINUTOS_MINIMOS:-120}
    depends_on:
      api:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificados de Let's Encrypt: si se pierden, Caddy los vuelve a pedir,
      # y Let's Encrypt limita cuántas veces por semana.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
      - api

volumes:
  db-data:
  caddy-data:
  caddy-config:
